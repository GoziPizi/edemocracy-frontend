<!-- 🔧 TEMPORARY TEST DISPLAY -->
<p *ngIf="!minimal" style="color: red; font-weight: bold;">
    Argument : {{ argument.title }}
  </p>
  
  <div
    id="container"
    [ngStyle]="{
      'background-color': getColorByValue(),
      'border-color': getBorderColor(),
      'border-width': '3px'
    }"
    (click)="navigateToDebate()"
  >
    <div id="user-informations">
      <p id="name">{{ name }}{{ work }}{{ politicSide }}</p>
    </div>
  <h4 *ngIf="argument.isFlaged">
    Ce commentaire est en attente de modération
    <span id="force-see" (click)="forceSee($event)">voir quand même</span>.
  </h4>

  <h4 id="title" *ngIf="!argument.isFlaged || isForcedShown">
    {{ argument.title }}
  </h4>

  <p id="content" *ngIf="(!argument.isFlaged || isForcedShown) && !minimal">
    {{ argument.content }}
  </p>

  <app-report
    id="report"
    [type]="reportType"
    [id]="argument.id"
    [size]="'small'"
  ></app-report>

  <div id="moderation-toolbar" *ngIf="isModerator">
    <button (click)="copy($event)" title="Copier le débat" *ngIf="moderationService.copyStatus">
      <i class="fa-regular fa-copy fa-xl"></i>
    </button>
    <button (click)="fusion($event)" title="Fusionner le débat" *ngIf="moderationService.fusionStatus">
      <i class="fa-solid fa-code-merge fa-xl"></i>
    </button>
  </div>

  <div id="votes" *ngIf="!minimal">
    <p>{{ argument.nbGood }}</p>
    <i
      class="fa fa-thumbs-up"
      aria-hidden="true"
      [ngClass]="{ green: argument.hasVote }"
      (click)="onVoteUp($event)"
    ></i>
    <p>{{ argument.nbBad }}</p>
    <i
      class="fa fa-thumbs-down"
      aria-hidden="true"
      [ngClass]="{ red: argument.hasVote == false }"
      (click)="onVoteDown($event)"
    ></i>
  </div>

  
    <div id="color-bar">
      <div
        id="for"
        [ngStyle]="{ width: stringWidth, 'background-color': greenColor }"
      ></div>
      <div
        id="against"
        [ngStyle]="{ width: oppositeStringWidth, 'background-color': redColor }"
      ></div>
    </div>
  </div>
